name: Tests

on:
  # Branch pushes only: a release tag points at a commit main already tested, and the publish
  # workflow tests it again before uploading.
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'  # nightly macOS run

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
      - name: Install package and test dependencies
        run: mise run install
      - name: Run tests
        run: mise run test

  macos:
    # macOS runners queue for minutes while the tests take seconds; the code is plain Python,
    # so macOS runs nightly and on demand instead of on every push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
      - name: Install package and test dependencies
        run: mise run install
      - name: Run tests
        run: mise run test

  windows:
    # POSIX permission checks don't apply on Windows; this covers import, data paths,
    # cart/order flows and checkout previews against a mocked Lavka.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
      - name: Install package and test dependencies
        run: mise run install
      - name: Run the Windows-relevant tests
        run: uv run --locked --extra test python -m pytest -q tests/test_paths.py tests/test_order_mcp_integration.py tests/test_shopping_tools.py tests/test_render.py tests/test_region_selection.py tests/test_lavka_cart.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
      - name: Install package and test dependencies
        run: mise run install
      - name: Lint and type-check
        run: mise run lint
