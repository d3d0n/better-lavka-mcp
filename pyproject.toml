[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "better-lavka-mcp"
version = "0.8.2"
description = "MCP server for ordering groceries from Yandex Lavka Uzbekistan with an AI assistant"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
keywords = ["mcp", "model-context-protocol", "yandex", "lavka", "uzbekistan", "groceries"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Operating System :: POSIX",
  "Operating System :: MacOS",
  "Topic :: Utilities",
]
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.10,<2",
  "httpx>=0.27,<1",
  "qrcode[pil]>=8,<9",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.urls]
Homepage = "https://github.com/d3d0n/better-lavka-mcp"
Source = "https://github.com/d3d0n/better-lavka-mcp"
Issues = "https://github.com/d3d0n/better-lavka-mcp/issues"

[project.scripts]
better-lavka-mcp = "better_lavka_mcp:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 160
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E9", "F", "I", "B"]

[tool.ty.environment]
python-version = "3.12"
