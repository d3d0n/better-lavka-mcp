[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "better-lavka-mcp"
version = "0.1.0"
description = "MCP server for Yandex Lavka Uzbekistan"
license = "GPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.9,<2",
  "httpx>=0.27,<1",
  "qrcode[pil]>=8,<9",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
better-lavka-mcp = "better_lavka_mcp.server:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
